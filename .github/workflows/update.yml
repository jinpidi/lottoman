name: 주간 데이터 갱신

on:
  schedule:
    - cron: "40 12 * * 6" # 매주 토요일 21:40 KST (추첨 20:35 + 데이터 반영 여유)
  workflow_dispatch: {} # 수동 실행 버튼

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: 최신 데이터로 재빌드
        run: python build.py
      - name: 변경 있으면 커밋·푸시 (GitHub Pages 자동 재배포)
        run: |
          git config user.name "lottoman-bot"
          git config user.email "actions@users.noreply.github.com"
          git add index.html
          git diff --cached --quiet || git commit -m "data: 주간 당첨번호 갱신"
          git push
